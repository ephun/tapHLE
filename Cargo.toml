[workspace]
# Path dependencies of the root package join the workspace automatically. The
# desktop frontend depends on the root package rather than the other way round,
# so it has to be listed. It is also a default member so that the ordinary
# `cargo build` and the lint/format scripts cover it.
members = ["crates/taphle", "crates/gui"]
default-members = ["crates/taphle", "crates/gui"]

[workspace.package]
version = "0.2.4-dev.1"
edition = "2021"
license = "MPL-2.0"
authors = ["tapHLE project contributors", "touchHLE project contributors"]
homepage = "https://github.com/ephun/tapHLE"
repository = "https://github.com/ephun/tapHLE"

[workspace.dependencies]
cc = "1.0.83"
# Declared for the workspace because the emulator and the frontend both open
# an SDL window, and two declarations could drift to two different SDLs.
sdl2 = { git = "https://github.com/touchHLE/rust-sdl2", tag = "touchHLE-3", features = ["hidapi"] }
cmake = "0.1.49"
gl_generator = "0.14.0"
