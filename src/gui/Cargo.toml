[package]
name = "tapHLE_gui"
description = "Desktop frontend for the tapHLE emulator"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

# One executable, and it keeps the emulator's name because that is the name
# every script, options file and compatibility report already drives. It is
# built by this package because this is the package that depends on the other.
[[bin]]
name = "tapHLE"
path = "src/main.rs"

[dependencies]
# The frontend links the emulator library so that app bundles, launch options
# and tapHLE's file locations have exactly one implementation. The reasoning is
# in docs/architecture.md.
tapHLE = { path = "../.." }
tapHLE_version = { path = "../version" }
# egui draws the interface. The window, the event loop and the input come from
# SDL rather than from eframe, because SDL is what the emulator already uses
# on all five platforms and what android/ is already built around. See
# src/shell.rs.
egui = "0.33"
egui_glow = "0.33"
glow = "0.16"
sdl2 = { workspace = true }
# Native file pickers and message boxes. This is the one place where a system
# control is unambiguously better than a drawn one.
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Both are already in the emulator's dependency tree. flate2 compresses the
# cached icon bitmaps, which avoids adding a PNG encoder; plist reads the
# App Store metadata that sits beside an IPA's bundle.
flate2 = "1.0"
plist = "1.8.0"

[target.'cfg(windows)'.dependencies]
# Only to reattach to the terminal that started the frontend. A windowed
# program has no console of its own, which is right when it is double-clicked
# and wrong when it is run from a prompt.
windows-sys = { version = "0.61.0", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
# Attaches the icon and the version properties Explorer and the Start menu
# show. Windows-only, and a build dependency, so it is not in the shipped
# binary's licence list.
winresource = "0.1"
