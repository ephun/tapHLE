name: Start work on a game
description: Track work that you or your coding agent plan to do.
labels: ["game target"]
body:
  - type: markdown
    attributes:
      value: |
        This is a place to track work, not a promise that someone else will do it.
        You can use your own coding agent. Start with [HELP_A_GAME.md](https://github.com/ephun/tapHLE/blob/trunk/HELP_A_GAME.md).
        Never upload an IPA, game files, or a raw log.
  - type: input
    id: game
    attributes:
      label: Game title
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Exact version, build, and region
    validations:
      required: true
  - type: input
    id: bundle_identity
    attributes:
      label: Bundle identifier and CFBundleVersion
      description: Copy these from the embedded Info.plist or local tapHLE --info output when available.
  - type: input
    id: archive_item
    attributes:
      label: Exact Archive.org item URL
      description: Optional. Use only an exact https://archive.org/details/<identifier> URL that you already have. Do not ask an agent to search for one.
  - type: input
    id: archive_filename
    attributes:
      label: Exact Archive.org IPA filename
      description: Required when an Archive.org item is referenced.
  - type: textarea
    id: current_state
    attributes:
      label: What currently happens in tapHLE?
      description: Include how far the game gets and any visible or logged failure.
    validations:
      required: true
  - type: textarea
    id: milestone
    attributes:
      label: Smallest useful next milestone
      placeholder: Reach the main menu with working audio and input.
    validations:
      required: true
  - type: input
    id: taphle_version
    attributes:
      label: tapHLE version
      description: Give a release number or Git commit. Ask your agent if you do not know it.
      placeholder: v0.3.0-alpha.1 or commit abc1234
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host environment
      description: Give Windows/CPU/GPU/driver details, or the iOS device and OS version.
      placeholder: Windows 11, Ryzen 7 5800X, RTX 3070; or iPhone 16 Pro, iOS 18.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Launch steps and tapHLE options
      description: Ask your agent to fill this in if you are not sure.
  - type: dropdown
    id: evidence
    attributes:
      label: Can you or your agent test this exact game version on the named host?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: Artifact check
      options:
        - label: I will not upload an app, extracted assets, keys, save data, or other proprietary payloads.
          required: true
        - label: If I gave an Archive.org link, my agent will follow compatibility/README.md before it opens or runs the IPA. It will stop if any file name, hash, app ID, or version check fails.
          required: true
        - label: If I gave an Archive.org link, I checked whether the rightsholder still sells or officially offers the game. I understand that the maintainer decides whether Archive-based testing fits the project rules.
          required: true
        - label: I understand that this issue does not require another contributor to do the work.
          required: true
