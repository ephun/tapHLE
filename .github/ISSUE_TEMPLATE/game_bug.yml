name: Report a game compatibility problem
description: Report a crash, hang, or incorrect behavior on a supported host.
labels: ["game compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Exact versions and clean reproduction steps make compatibility work
        much faster. Do not attach the game, game assets, keys, or raw logs
        containing personal data. Canonical Archive.org references are allowed
        only under compatibility/README.md.
  - type: input
    id: game
    attributes:
      label: Game title
      placeholder: Super Monkey Ball
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: Game version and build
      description: Include the region or build identifier when known.
      placeholder: 1.0 (US)
    validations:
      required: true
  - type: input
    id: bundle_identity
    attributes:
      label: Bundle identifier and CFBundleVersion
      description: Copy these from the embedded Info.plist or local tapHLE --info output.
      placeholder: com.example.Game — CFBundleVersion 1.2
  - type: input
    id: archive_item
    attributes:
      label: Maintainer-supplied canonical Archive.org item URL
      description: Optional. Do not search for or guess an item; use the exact https://archive.org/details/<identifier> URL.
  - type: input
    id: archive_filename
    attributes:
      label: Exact Archive.org IPA filename
      description: Required when an Archive.org item is referenced; similar filenames are not interchangeable.
  - type: input
    id: taphle_version
    attributes:
      label: tapHLE version
      description: Give a release number or Git commit.
      placeholder: v0.3.0-alpha.1 or commit abc1234
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host environment
      description: Give Windows/CPU/GPU/driver details, or the iOS device and OS version.
      placeholder: Windows 11 24H2, Ryzen 7 5800X, RTX 3070; or iPhone 16 Pro, iOS 18.6
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and options
      description: Include the exact tapHLE options needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: State the last thing that works before the problem occurs.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized tapHLE log
      description: Remove usernames, personal paths, tokens, and proprietary data.
      render: text
  - type: checkboxes
    id: legal
    attributes:
      label: Artifact check
      options:
        - label: I have not attached an app, extracted assets, keys, save data, or other proprietary payloads.
          required: true
        - label: I removed personal data and proprietary game content from the report.
          required: true
        - label: Any Archive.org reference above is exact, maintainer-supplied, and follows compatibility/README.md, including current-market and takedown rules.
          required: true
