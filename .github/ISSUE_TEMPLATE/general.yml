name: Report a general Windows bug or propose a feature
description: Use this for tapHLE itself when one specific game is not the focus.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the Windows use case and why it helps game compatibility.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current behavior and evidence
      description: Include reproduction steps, tapHLE revision, and relevant logs.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request concerns game emulation on a supported host or development needed to support it.
          required: true
        - label: I have not attached proprietary game material or unauthorized links.
          required: true
